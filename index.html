<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>ملاحق استكشاف الكهرباء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;700;800&display=swap">
<style>
/* Layout: a blueprint desk for an electricity lesson. The book is drawn like a circuit: navy blueprint
   covers and section dividers wired with a battery, a switch and a lit lamp; paper pages carry the
   citation frame, the scanned page and a wire-and-node footer. */
:root {
  --desk: #091d36;
  --desk-2: #10305a;
  --grid: rgba(170, 205, 245, 0.06);
  --ink: #eef4fc;
  --muted: #a8c0dc;
  --accent: #8cc0f5;
  --glow: #ffd45a;
  --panel: rgba(8, 26, 48, 0.66);
  --panel-line: rgba(140, 192, 245, 0.28);
  --shade: rgba(2, 10, 22, 0.6);
  /* page (paper) tokens */
  --paper: #fcfdfe;
  --paper-ink: #13355e;
  --paper-muted: #4a5f78;
  --frame: #4a7ebb;
  --frame-fill: #dbeff4;
  --navy: #0f2f55;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --font-head: "Noto Kufi Arabic", "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 15px;
  background-color: var(--desk);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    radial-gradient(ellipse at 50% 40%, var(--desk-2) 0%, var(--desk) 72%);
  background-size: 28px 28px, 28px 28px, 100% 100%;
  background-attachment: fixed;
}
.app {
  min-height: 100%; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
  padding-block: 12px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 10px 14px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.bulb { width: 36px; height: 36px; flex: none; filter: drop-shadow(0 0 8px rgba(255, 212, 90, 0.55)); }
.titles { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
h1 { font-family: var(--font-head); font-weight: 700; font-size: 1.08rem; margin: 0; line-height: 1.5; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.82rem; }
.picker { display: flex; align-items: center; gap: 8px; min-width: 0; }
.picker label { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
select {
  font: inherit; font-size: 0.9rem; color: var(--ink); background: #0c2443;
  border: 1px solid var(--panel-line); border-radius: 10px; padding: 7px 10px; max-width: min(440px, 72vw);
}
.where { text-align: center; font-family: var(--font-head); font-weight: 500; font-size: 0.95rem; color: var(--accent); min-height: 1.6em; }
.stage { flex: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 0; }
.bookwrap { width: 100%; margin-inline: auto; filter: drop-shadow(0 16px 30px var(--shade)); }
#book { transform: scaleX(-1); }   /* mirrored so the book opens right-to-left like an Arabic book */

/* ---------- pages ---------- */
.page { background: var(--paper); container-type: size; overflow: hidden; }
.pg { position: absolute; inset: 0; transform: scaleX(-1); direction: rtl; }
.pg svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
/* navy pages: cover, dividers, back */
.pg.navy { color: #fff; }
.pg svg.art { direction: ltr; }
.pg.navy .txt { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2cqw; }
.pg.navy .txt.cover { inset: 37% 16% 19%; }
.pg.navy .txt.divider { inset: 31% 16% 15%; gap: 1.6cqw; }
.pg.navy .txt.back { inset: 59% 10% 7%; }
.eyebrow { font-family: var(--font-head); font-weight: 500; font-size: 3.4cqw; letter-spacing: 0.06em; color: var(--glow); }
.num { font-family: var(--font-head); font-weight: 800; font-size: 12.5cqw; line-height: 1.1; text-shadow: 0 0.4cqw 1.6cqw rgba(0, 0, 0, 0.35); }
.big { font-family: var(--font-head); font-weight: 800; font-size: 8.6cqw; line-height: 1.3; text-shadow: 0 0.4cqw 1.6cqw rgba(0, 0, 0, 0.35); }
.mid2 { font-family: var(--font-head); font-weight: 500; font-size: 4.4cqw; color: #cfe3fa; line-height: 1.5; }
.kind { font-family: var(--font-body); font-weight: 600; font-size: 4cqw; color: var(--glow); line-height: 1.5; }
.ref { font-family: var(--font-body); font-size: 2.3cqw; color: #b9cfe8; line-height: 1.6; max-width: 92%; }
.rule { width: 30%; height: 0.35cqw; border-radius: 1cqw; background: linear-gradient(to left, transparent, var(--glow), transparent); margin-block: 1cqw; }
/* paper pages */
.pg.paper { color: var(--paper-ink); }
.paper .wrap { position: absolute; inset: 6.5% 7.5% 8.5%; display: flex; flex-direction: column; gap: 2.2cqw; }
.hdr {
  background: var(--frame-fill); border: 0.28cqw solid var(--frame); border-radius: 2.6cqw;
  padding: 1.6cqw 2.6cqw; text-align: center; display: flex; flex-direction: column; gap: 0.6cqw;
}
.hdr .code { font-family: var(--font-head); font-weight: 700; font-size: 3.2cqw; color: var(--navy); }
.hdr .cap { font-size: 2.55cqw; line-height: 1.55; }
.hdr .locs { font-size: 2.4cqw; line-height: 1.6; color: var(--paper-muted); }
.hdr .locs b { color: var(--paper-ink); font-weight: 600; }
.shot { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.shot img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; border: 0.32cqw solid var(--frame); box-shadow: 0 0.8cqw 2.4cqw rgba(15, 47, 85, 0.22); background: #fff; }
.ftr { position: absolute; inset: auto 7.5% 2.6%; display: flex; align-items: center; justify-content: space-between; font-size: 2.2cqw; color: var(--paper-muted); }
.ftr .lbl { background: var(--paper); padding-inline: 1.2cqw; }
.ftr .no { background: var(--paper); border: 0.28cqw solid var(--frame); color: var(--navy); border-radius: 50%; width: 5.6cqw; height: 5.6cqw; display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- simulation page: a desktop computer inside the book ---------- */
.simpage { position: absolute; inset: 5.5% 7% 4%; display: flex; flex-direction: column; align-items: center; gap: 1.4cqw; text-align: center; }
.simtitle { font-family: var(--font-head); font-weight: 800; font-size: 6.2cqw; line-height: 1.4; text-shadow: 0 0.4cqw 1.6cqw rgba(0, 0, 0, 0.35); }
.monitor {
  position: relative; width: 100%; box-sizing: border-box; margin-top: 1.6cqw;
  padding: 2.2cqw 2.2cqw 4.2cqw; border-radius: 2.6cqw;
  background: linear-gradient(160deg, #3a4048, #1b1f25 55%, #111418);
  box-shadow: 0 1.6cqw 4cqw rgba(0, 0, 0, 0.5), inset 0 0.25cqw 0 rgba(255, 255, 255, 0.12);
}
.monitor .cam { position: absolute; top: 0.8cqw; left: 50%; width: 0.9cqw; height: 0.9cqw; margin-left: -0.45cqw; border-radius: 50%; background: #0b0d10; box-shadow: inset 0 0 0 0.2cqw #2a3038; }
.monitor .led { position: absolute; bottom: 1.6cqw; left: 3cqw; width: 1cqw; height: 1cqw; border-radius: 50%; background: #3c4650; }
.monitor.on .led { background: #4cff8a; box-shadow: 0 0 1.2cqw #4cff8a; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 0.6cqw; background: radial-gradient(ellipse at 50% 40%, #1d4a7a, #0a1f38 75%); box-shadow: inset 0 0 0 0.25cqw #000; }
.screen iframe { position: absolute; top: 0; left: 0; width: 1024px; height: 640px; border: 0; transform-origin: 0 0; background: #fff; }
.power { position: absolute; inset: 0; width: 100%; border: 0; border-radius: 0; background: transparent; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2cqw; cursor: pointer; padding: 0; }
.power .pw-ico { width: 13cqw; height: 13cqw; border-radius: 50%; display: grid; place-items: center; font-size: 7cqw; color: #0b2140; background: radial-gradient(circle at 35% 30%, #fff6cc, #ffd45a 55%, #d99a12); box-shadow: 0 0 3cqw rgba(255, 212, 90, 0.55); }
.power .pw-t { font-family: var(--font-head); font-weight: 700; font-size: 3.6cqw; }
.power .pw-s { font-size: 2.6cqw; color: #a8c0dc; }
.power:hover .pw-ico { box-shadow: 0 0 4.5cqw rgba(255, 212, 90, 0.8); }
.neck { width: 16%; height: 4.5cqw; background: linear-gradient(90deg, #6d747c, #d8dde2 45%, #8b929a); clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%); }
.foot { width: 42%; height: 2.2cqw; border-radius: 1.4cqw 1.4cqw 0.6cqw 0.6cqw; background: linear-gradient(180deg, #e2e6ea, #8b929a); box-shadow: 0 1cqw 2cqw rgba(0, 0, 0, 0.45); }
.simrow { display: flex; gap: 2cqw; margin-top: 1.2cqw; }
.simbig { font-size: 2.8cqw; padding: 1.2cqw 3.6cqw; border-radius: 1.6cqw; background: var(--accent); border-color: var(--accent); color: #0b2140; font-weight: 600; }
.simhow { font-size: 2.7cqw; line-height: 1.7; color: #dbe8f7; max-width: 92%; }
.simref { font-size: 2.2cqw; line-height: 1.6; color: var(--glow); max-width: 94%; }
.simlic { font-size: 2cqw; color: #a8c0dc; }
#simZoom {
  position: fixed; inset: 0; z-index: 30; overflow: auto;
  background: radial-gradient(ellipse at 50% 30%, #143a66, #081a30 75%);
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.simwrap { width: min(100%, calc((100vh - 170px) * 1.6 + 60px)); margin-inline: auto; display: flex; flex-direction: column; align-items: center; container-type: inline-size; }
.simbar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.monitor.big { padding: 16px 16px 30px; border-radius: 18px; margin-top: 0; }
.monitor.big .cam { top: 6px; width: 7px; height: 7px; margin-left: -3.5px; }
.monitor.big .led { bottom: 11px; left: 22px; width: 8px; height: 8px; }
.monitor.big .screen iframe { width: 100%; height: 100%; transform: none; }
.neck.big { height: 34px; }
.foot.big { height: 16px; border-radius: 12px 12px 5px 5px; }

/* ---------- controls ---------- */
.side {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: var(--panel); border: 1px solid var(--panel-line); color: var(--ink); padding: 0;
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
}
.side:hover:not(:disabled) { background: rgba(140, 192, 245, 0.18); border-color: var(--accent); transform: scale(1.06); }
.side svg { width: 24px; height: 24px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.mid { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
button { font: inherit; font-size: 0.9rem; cursor: pointer; border-radius: 10px; padding: 8px 14px; border: 1px solid var(--panel-line); background: var(--panel); color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
button svg { width: 18px; height: 18px; flex: none; }
button.go { background: var(--accent); border-color: var(--accent); color: #0b2140; font-weight: 600; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.88rem; min-width: 10em; text-align: center; }
.wire { position: relative; height: 4px; border-radius: 4px; background: rgba(140, 192, 245, 0.22); }
.wire .fill { position: absolute; inset-block: 0; inset-inline-start: 0; width: 0; border-radius: 4px; background: linear-gradient(to left, var(--accent), var(--glow)); transition: width 0.5s ease; }
.wire .fill::after { content: ""; position: absolute; inset-inline-end: -5px; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px 3px rgba(255, 212, 90, 0.6); }
.hint { text-align: center; color: var(--muted); font-size: 0.78rem; }
#zoom {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: rgba(8, 24, 44, 0.97);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.zoombar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 10px; background: rgba(8, 24, 44, 0.97); }
.zoompages { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.zoompages img { width: 100%; max-width: 1000px; background: #fff; box-shadow: 0 4px 18px var(--shade); }
.zoomnote { color: var(--muted); text-align: center; padding: 24px; }
.fallback { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.fallback .page { position: relative; width: min(100%, 640px); aspect-ratio: 1000 / 1295; }
@media (max-width: 760px) {
  .side { display: none; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 0.98rem; }
}
@media (prefers-reduced-motion: reduce) { .side, .wire .fill { transition: none; } }
</style>

  <defs>

    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d858d"/><stop offset=".35" stop-color="#eef1f4"/><stop offset="1" stop-color="#6a7178"/></linearGradient>
    <linearGradient id="battBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f45"/><stop offset=".25" stop-color="#6b7279"/><stop offset=".5" stop-color="#2a2e33"/><stop offset="1" stop-color="#121417"/></linearGradient>

    <radialGradient id="brass" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#e2b33c"/><stop offset="1" stop-color="#8a6512"/></radialGradient>

<div class="app" dir="rtl" lang="ar">
  <header>
    <div class="brand">
      <svg class="bulb" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 4a11 11 0 0 0-6.6 19.8c1.3 1 2.1 2.4 2.1 4V29h9v-1.2c0-1.6.8-3 2.1-4A11 11 0 0 0 20 4z" fill="#ffd45a"/>

      </svg>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

      c.appendChild(el('div', 'simtitle', 'جرّب الدائرة الكهربائية بنفسك'));
      var mon = el('div', 'monitor');
      var scr = el('div', 'screen');
      var power = el('button', 'power');
      power.type = 'button';
      power.appendChild(el('span', 'pw-ico', '⏻'));
      power.appendChild(el('span', 'pw-t', 'تشغيل المحاكاة على الشاشة'));
      power.appendChild(el('span', 'pw-s', 'مجموعة بناء الدوائر: تيار مستمر'));
      scr.appendChild(power);
      mon.appendChild(el('span', 'cam'));
      mon.appendChild(scr);
      mon.appendChild(el('span', 'led'));
      c.appendChild(mon);
      c.appendChild(el('div', 'neck'));
      c.appendChild(el('div', 'foot'));
      var row = el('div', 'simrow');
      var big = el('button', 'simbig', 'تكبير الشاشة'); big.type = 'button';
      row.appendChild(big);
      c.appendChild(row);
      c.appendChild(el('div', 'simhow', 'اسحب البطارية والمصباح والمفتاح والأسلاك إلى لوحة العمل، وصِلها في دائرة، ثم أغلق المفتاح ليضيء المصباح وافتحه لينطفئ.'));
      c.appendChild(el('div', 'simref', '(PhET Interactive Simulations, n.d.) · مواضع الاستشهاد في التقرير: المشكلة 1 — مهارات القرن 21: المعرفة الرقمية'));
      c.appendChild(el('div', 'simlic', 'المحاكاة من PhET Interactive Simulations، جامعة كولورادو بولدر، برخصة CC BY 4.0.'));
      pg.appendChild(c);
      power.addEventListener('click', function () {
        if (scr.querySelector('iframe')) return;
        var fr = document.createElement('iframe');
        fr.src = SIM; fr.title = 'محاكاة الدوائر الكهربائية من PhET'; fr.setAttribute('allow', 'fullscreen');
        scr.appendChild(fr); mon.classList.add('on'); power.hidden = true; fitScreens();
      });
      big.addEventListener('click', openSim);
      // presses on the computer and its buttons must not start a page turn
      [mon, big].forEach(function (n) {
        ['mousedown', 'touchstart'].forEach(function (ev) { n.addEventListener(ev, function (e) { e.stopPropagation(); }, { passive: true }); });
      });
    } else if (p.t === 'cover' || p.t === 'back' || p.t === 'divider') {
      pg.classList.add('navy');
      pg.innerHTML = navyArt(p.t);
      var t = el('div', 'txt ' + p.t);
      if (p.t === 'cover') {
        t.appendChild(el('div', 'eyebrow', 'مقرر TCST418 · تعليم STEAM لمعلمي المرحلة الابتدائية'));
        t.appendChild(el('div', 'num', 'الملاحق'));
        t.appendChild(el('div', 'rule'));
        t.appendChild(el('div', 'mid2', 'أدلة الاستشهادات في التكليف 3'));
        t.appendChild(el('div', 'kind', 'مخطط تكاملي STEAM لدرس «استكشاف الكهرباء»'));
        t.appendChild(el('div', 'ref', 'العلوم · الصف الثاني الابتدائي · الجزء الثاني · الوحدة السادسة: القوى والطاقة'));
      } else if (p.t === 'back') {
        t.appendChild(el('div', 'big', 'نهاية الملاحق'));
        t.appendChild(el('div', 'rule'));
        t.appendChild(el('div', 'mid2', 'الدائرة مغلقة… فأضاء المصباح'));
        t.appendChild(el('div', 'ref', '«يجب أن تكون الدائرة موصلة تمامًا أي مغلقة حتى تتحرك فيها الكهرباء» (كتاب الطالب، ص. 104)'));
      } else {
        t.appendChild(el('div', 'eyebrow', 'ملحق'));
        t.appendChild(el('div', 'num', String(p.i)));
        t.appendChild(el('div', 'big', p.subj));
        t.appendChild(el('div', 'rule'));
        t.appendChild(el('div', 'mid2', p.grade));
        t.appendChild(el('div', 'kind', p.kind));
        t.appendChild(el('div', 'ref', p.ref));
      }
      pg.appendChild(t);
    } else {
      pg.classList.add('paper');
      pg.innerHTML = PAPER_ART;
      var w = el('div', 'wrap');
      var h = el('div', 'hdr');
      h.appendChild(el('div', 'code', '(' + p.code + ')'));
      if (p.cap) h.appendChild(el('div', 'cap', p.cap));
      if (p.locs) { var l = el('div', 'locs'); l.appendChild(el('b', null, 'مواضع الاستشهاد في التقرير: ')); l.appendChild(document.createTextNode(p.locs)); h.appendChild(l); }
      w.appendChild(h);
      var s = el('div', 'shot'); var im = el('img'); im.alt = p.code; im.setAttribute('data-src', p.img); im.decoding = 'async';
      s.appendChild(im); w.appendChild(s); pg.appendChild(w);
      lazy[idx] = im;
      var f = el('div', 'ftr'); f.appendChild(el('span', 'lbl', 'ملحق (' + p.i + ') · ' + p.subj)); f.appendChild(el('span', 'no', String(idx + 1)));
      pg.appendChild(f);
    }
    page.appendChild(pg); book.appendChild(page);
  });
  function load(i) { var im = lazy[i]; if (im && !im.src) im.src = im.getAttribute('data-src'); }
  function loadAround(i) { for (var k = i - 3; k <= i + 6; k++) load(k); }

  var toc = document.getElementById('toc');
  TOC.forEach(function (t) { var o = document.createElement('option'); o.value = t[1]; o.textContent = t[0]; toc.appendChild(o); });
  function section(i) { var s = TOC[0]; TOC.forEach(function (t) { if (t[1] <= i) s = t; }); return i === total - 1 ? ['نهاية الملاحق', i] : s; }

  var count = document.getElementById('count'), where = document.getElementById('where'), fill = document.getElementById('fill');
  var btns = { prev: [document.getElementById('prev'), document.getElementById('sidePrev')], next: [document.getElementById('next'), document.getElementById('sideNext')] };
  var pf = null;

  function update(i) {
    loadAround(i);
    var two = pf && pf.getOrientation() === 'landscape' && i > 0 && i + 1 < total;
    count.textContent = (two ? ('الصفحتان ' + (i + 1) + '–' + (i + 2)) : ('الصفحة ' + (i + 1))) + ' من ' + total;
    btns.prev.forEach(function (b) { b.disabled = i <= 0; });
    btns.next.forEach(function (b) { b.disabled = i >= total - (two ? 2 : 1); });
    var s = section(two ? i + 1 : i); where.textContent = s[0];
    var opt = section(i); if (opt[0] !== 'نهاية الملاحق') toc.value = String(opt[1]);
    fill.style.width = (((two ? i + 2 : i + 1) / total) * 100).toFixed(1) + '%';
    setTimeout(fitScreens, 60);
  }

  if (typeof St === 'undefined' || !St.PageFlip) {
    // the page-flip library did not load: show the pages as a scrolling list instead
    book.style.transform = 'none'; book.className = 'fallback';
    lazy.forEach(function (im) { if (im) { im.loading = 'lazy'; im.src = im.getAttribute('data-src'); } });
    ['bar', 'sidePrev', 'sideNext'].forEach(function (id) { document.getElementById(id).hidden = true; });
    document.querySelector('.hint').hidden = true; document.querySelector('.wire').hidden = true;
    Array.prototype.forEach.call(book.querySelectorAll('.pg'), function (g) { g.style.transform = 'none'; });
    toc.addEventListener('change', function () { book.children[+toc.value].scrollIntoView({ behavior: 'smooth' }); where.textContent = section(+toc.value)[0]; });
    return;
  }

  var pageH = Math.max(320, Math.min(900, window.innerHeight - 250));
  var pageW = Math.round(pageH * 1000 / 1295);
  document.getElementById('bookwrap').style.maxWidth = (pageW * 2) + 'px';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  loadAround(0);
  pf = new St.PageFlip(book, {
    width: pageW, height: pageH, size: 'stretch',
    minWidth: 200, maxWidth: pageW, minHeight: 259, maxHeight: pageH,
    showCover: true, usePortrait: true, mobileScrollSupport: true,
    maxShadowOpacity: 0.45, flippingTime: reduce ? 250 : 850, drawShadow: !reduce
  });
  pf.loadFromHTML(document.querySelectorAll('#book .page'));
  pf.on('flip', function (e) { update(e.data); });
  pf.on('changeOrientation', function () { update(pf.getCurrentPageIndex()); });
  update(0);

  btns.prev.forEach(function (b) { b.addEventListener('click', function () { pf.flipPrev(); }); });
  btns.next.forEach(function (b) { b.addEventListener('click', function () { pf.flipNext(); }); });
  toc.addEventListener('change', function () { var i = +toc.value; loadAround(i); pf.turnToPage(i); update(i); });
  document.getElementById('simClose').addEventListener('click', function () { document.getElementById('simZoom').hidden = true; });
  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('simZoom').hidden) { if (e.key === 'Escape') document.getElementById('simZoom').hidden = true; return; }
    if (!document.getElementById('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
    if (e.target === toc) return;
    if (e.key === 'ArrowLeft') pf.flipNext();
    else if (e.key === 'ArrowRight') pf.flipPrev();
  });

  var zoom = document.getElementById('zoom'), zp = document.getElementById('zoomPages');
  function closeZoom() { zoom.hidden = true; zp.innerHTML = ''; document.getElementById('zoomBtn').focus(); }
  document.getElementById('zoomBtn').addEventListener('click', function () {
    var i = pf.getCurrentPageIndex();
    var show = (pf.getOrientation() === 'landscape' && i > 0 && i + 1 < total) ? [i, i + 1] : [i];
    if (show.some(function (k) { return P[k].t === 'sim'; })) { openSim(); return; }
    zp.innerHTML = '';
    var any = false;
    show.forEach(function (k) {
      var p = P[k]; if (p.t !== 'page') return; any = true;
      var im = document.createElement('img'); im.src = p.img; im.alt = '(' + p.code + ') مكبّرة'; zp.appendChild(im);
    });
    if (!any) zp.appendChild(el('p', 'zoomnote', 'هذه صفحة فاصلة لا تحوي صورة من كتاب. قلّب إلى صفحة كتاب ثم اضغط «تكبير الصفحة».'));
    document.getElementById('zoomTitle').textContent = show.length > 1 ? ('الصفحتان ' + (i + 1) + ' و' + (i + 2)) : ('الصفحة ' + (i + 1));
    zoom.hidden = false; zoom.scrollTop = 0; document.getElementById('zoomClose').focus();
  });
  document.getElementById('zoomClose').addEventListener('click', closeZoom);
})();
</script>
